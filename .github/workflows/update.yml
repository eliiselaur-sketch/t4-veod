name: Uuenda andmed

on:
  schedule:
    - cron: '*/10 * * * *'     # varuvõimalus; GitHub jätab neid tihti vahele
    - cron: '31,41,51 3,4 * * 1-5'  # hommikune käivitus 6.30 Tallinna aja järgi (UTC; talve- ja suveaeg), edasi kordab töövoog ennast ise
  workflow_dispatch:            # käsitsi käivitamine: Actions -> Uuenda andmed -> Run workflow
    inputs:
      force:
        description: 'Käivita ka väljaspool tööaega'
        type: boolean
        default: true
      backfill_from:
        description: 'Materjalide ajaloo täitmine alates (YYYY-MM-DD). Tühi = tavaline uuendus.'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['docs/index.html']  # kujunduse muutmisel avaldatakse leht kohe uuesti

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uuenda
  cancel-in-progress: false

jobs:
  uuenda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      start: ${{ steps.algus.outputs.start }}
    steps:
      - id: algus
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Paigalda Playwright
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Taasta salvestatud sessioon (kui olemas)
        if: github.event_name != 'push'
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
        run: |
          if [ -n "$AUTH_STATE_B64" ]; then
            echo "$AUTH_STATE_B64" | base64 -d > "$RUNNER_TEMP/auth.json"
            echo "AUTH_STATE_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
            echo "Sessioonifail leitud."
          else
            echo "Sessioonifaili pole, kasutan paroole."
          fi

      - name: Too andmed
        if: github.event_name != 'push'
        env:
          QM_EMAIL: ${{ secrets.QM_EMAIL }}
          QM_PASSWORD: ${{ secrets.QM_PASSWORD }}
          TIKA_PIN: ${{ secrets.TIKA_PIN }}
          VIRUKULA_PIN: ${{ secrets.VIRUKULA_PIN }}
          JAAKNA_PIN: ${{ secrets.JAAKNA_PIN }}
          TIKA_EMAIL: ${{ secrets.TIKA_EMAIL }}
          TIKA_PASSWORD: ${{ secrets.TIKA_PASSWORD }}
          VIRUKULA_EMAIL: ${{ secrets.VIRUKULA_EMAIL }}
          VIRUKULA_PASSWORD: ${{ secrets.VIRUKULA_PASSWORD }}
          JAAKNA_EMAIL: ${{ secrets.JAAKNA_EMAIL }}
          JAAKNA_PASSWORD: ${{ secrets.JAAKNA_PASSWORD }}
          WAYBILLER_EMAIL: ${{ secrets.WAYBILLER_EMAIL }}
          WAYBILLER_PASSWORD: ${{ secrets.WAYBILLER_PASSWORD }}
          DATA_PIN: ${{ secrets.DATA_PIN }}
        run: |
          if [ -n "${{ inputs.backfill_from }}" ]; then
            python scraper/fetch.py --backfill "${{ inputs.backfill_from }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scraper/fetch.py --force
          else
            python scraper/fetch.py
          fi

      - name: Salvesta andmed repositooriumisse
        if: github.event_name != 'push'
        run: |
          rm -f "$RUNNER_TEMP/auth.json"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Andmed ei muutunud."
          else
            git config user.name "t4-andmed[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Andmed $(TZ=Europe/Tallinn date '+%d.%m.%Y %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  avalda:
    needs: uuenda
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHubi ajastus (cron) on ebatäpne, seega käivitab töövoog end ise uuesti ~10 min pärast eelmise algust.
  jargmine:
    needs: [uuenda, avalda]
    if: always() && github.event_name != 'push' && inputs.backfill_from == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Oota ja käivita järgmine uuendus
        run: |
          D=$(TZ=Europe/Tallinn date +%u); HM=$(TZ=Europe/Tallinn date +%H%M)
          if [ "$D" -gt 5 ] || [ "$HM" -lt 0620 ] || [ "$HM" -ge 1850 ]; then echo "Väljaspool tööaega, kordust ei käivita."; exit 0; fi
          START="${{ needs.uuenda.outputs.start }}"; [ -z "$START" ] && START=$(date +%s)
          WAIT=$(( START + 600 - $(date +%s) )); [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          ACTIVE=$(gh run list -w update.yml -L 20 --json status,databaseId \
            -q '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$ACTIVE" -gt 0 ]; then echo "Teine uuendus juba ootel/käib, uut ei käivita."; exit 0; fi
          gh workflow run update.yml --ref main -f force=false
          echo "Järgmine uuendus käivitatud."
